<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rulebook RAG</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    form { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; font-size: 1rem; }
    button { padding: 10px 16px; font-size: 1rem; cursor: pointer; }
    #answer { white-space: pre-wrap; margin-top: 24px; line-height: 1.5; }
    #sources { margin-top: 16px; font-size: 0.9rem; color: #555; }
    .cited { font-weight: 600; color: #222; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Ask the rulebooks</h1>
  <p>Catan, Monopoly, Blackjack, Poker, Texas Hold'em, Rummy</p>

  <form id="ask-form">
    <input id="question" placeholder="e.g. Do you collect money on Free Parking?" autocomplete="off">
    <button type="submit">Ask</button>
  </form>

  <div id="answer"></div>
  <div id="sources"></div>

  <script>
    const form = document.getElementById("ask-form");
    const answerEl = document.getElementById("answer");
    const sourcesEl = document.getElementById("sources");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();                       // stop the page from reloading
      const question = document.getElementById("question").value;
      answerEl.textContent = "Thinking…";
      answerEl.className = "";
      sourcesEl.textContent = "";

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Request failed");

        answerEl.textContent = data.answer;         // textContent, never innerHTML
        const list = document.createElement("ul");
        for (const s of data.sources) {
          const li = document.createElement("li");
          li.textContent = `${s.id} (${s.game}, page ${s.page})`;
          if (data.answer.includes(s.id)) li.className = "cited";   // bold = actually cited
          list.appendChild(li);
        }
        sourcesEl.textContent = "Sources:";
        sourcesEl.appendChild(list);
      } catch (err) {
        answerEl.textContent = err.message;
        answerEl.className = "error";
      }
    });
  </script>
</body>
</html>
